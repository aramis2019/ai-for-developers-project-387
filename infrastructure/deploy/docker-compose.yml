# Продакшен-стек Meetly на VPS (ams-1-vm-h0yq, 5.129.226.164).
#
# Рабочая копия живёт на сервере в /home/development/meetly/ вместе с .env
# (MEETLY_DB_PASSWORD) и deploy.sh. Этот файл в репозитории — канонический
# источник: при изменении скопировать на сервер (scp) и запустить deploy.sh.
#
# Edge — общий Traefik (/home/development/traefik-app, сеть webproxy):
# TLS от Let's Encrypt (резолвер letsEncrypt), HTTP→HTTPS редирект.
#
# База данных — хостовый PostgreSQL 18 (системный сервис, кластер 18/main),
# а не контейнер. Тот же кластер обслуживает iplocator. Роль и БД заводит
# provision-db.sh, доступ ограничен в pg_hba.conf docker-подсетями.
#
# На Linux алиас host.docker.internal не существует по умолчанию — его даёт
# extra_hosts с host-gateway. Так же подключается iplocator.
#
# Приложение применяет миграции и сидер на старте (InitializeMeetlyAsync).
# Если Postgres в этот момент недоступен, старт падает — это осознанно:
# restart: unless-stopped перезапустит контейнер, пока БД не поднимется.
# Отдельного depends_on/healthcheck здесь нет, БД живёт вне compose.

services:
  meetly-app:
    image: docker.lurax.ru/linnetlab/meetly:latest
    container_name: meetly-app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: "8080"
      Storage__Provider: Postgres
      ConnectionStrings__Meetly: Host=host.docker.internal;Port=5432;Database=meetly;Username=meetly;Password=${MEETLY_DB_PASSWORD}
    networks:
      - webproxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meetly.rule=Host(`meetly.linnetlab.com`)"
      - "traefik.http.routers.meetly.entrypoints=https"
      - "traefik.http.routers.meetly.tls=true"
      - "traefik.http.routers.meetly.tls.certresolver=letsEncrypt"
      - "traefik.http.services.meetly.loadbalancer.server.port=8080"
      - "traefik.docker.network=webproxy"

networks:
  webproxy:
    external: true
