name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeSpec lint
        run: npm run contract:lint

      - name: OpenAPI freshness
        run: npm run contract:check

      - name: schema.d.ts freshness
        run: |
          npm run api:types
          git diff --exit-code frontend/src/api/schema.d.ts

  typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck -w @meetly/frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore
        working-directory: backend

      - name: Build
        run: dotnet build Meetly.slnx -c Release
        working-directory: backend

      - name: Test
        run: dotnet test Meetly.slnx -c Release --no-build --logger "console;verbosity=normal"
        working-directory: backend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [contract, typecheck, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t meetly:ci-${{ github.sha }} .
